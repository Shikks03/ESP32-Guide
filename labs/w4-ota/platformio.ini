[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes

; Second environment: same firmware, but "upload" goes over Wi-Fi instead of USB.
; Set the password in the terminal first (same value as OTA_PASSWORD in secrets.h):
;   $env:OTA_PASSWORD = "your-ota-password"
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = bench.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
